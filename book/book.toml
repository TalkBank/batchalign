[book]
title = "Batchalign"
authors = ["TalkBank Contributors"]
description = "User, developer, and architecture documentation for Batchalign."
language = "en"
src = "src"

[build]
build-dir = "build"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.linkcheck2]
follow-web-links = false
traverse-parent-directories = false
warning-policy = "error"

[output.html]
additional-css = ["theme/downloads.css"]
no-section-label = true
git-repository-url = "https://github.com/TalkBank/batchalign"
edit-url-template = "https://github.com/TalkBank/batchalign/edit/main/book/{path}"

[output.html.fold]
enable = true
level = 0

[output.html.search.chapter]
"diataxis" = { enable = false }
"batchalign/reference/documentation-audit.md" = { enable = false }

# Former product manuals and consolidated pages now point to their owners.
