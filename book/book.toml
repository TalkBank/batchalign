[book]
title = "Batchalign"
authors = ["TalkBank Contributors"]
description = "User, developer, and architecture documentation for Batchalign."
language = "en"
src = "src"

[build]
build-dir = "build"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.linkcheck2]
follow-web-links = false
traverse-parent-directories = false
warning-policy = "error"

[output.html]
no-section-label = true
git-repository-url = "https://github.com/TalkBank/batchalign"
edit-url-template = "https://github.com/TalkBank/batchalign/edit/main/book/{path}"

[output.html.fold]
enable = true
level = 0

# Keep navigation and retired-location pointers out of factual search results.
