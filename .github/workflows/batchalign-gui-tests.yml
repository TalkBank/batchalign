name: Batchalign GUI tests

on:
  push:
    paths:
      - 'apps/batchalign/batchalign-gui/**'
      - 'just/batchalign-gui.just'
      - '.github/workflows/batchalign-gui-tests.yml'
  pull_request:
    paths:
      - 'apps/batchalign/batchalign-gui/**'
      - 'just/batchalign-gui.just'
      - '.github/workflows/batchalign-gui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-tests-${{ github.ref }}
  # Preserve teardown diagnostics when follow-up tests or fixes are pushed.
  cancel-in-progress: false

jobs:
  frontend:
    name: GUI (${{ matrix.os }}, ${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
        browser: [chromium, webkit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/batchalign/batchalign-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/batchalign/batchalign-gui/package-lock.json
      - run: npm ci
      # macOS 14 is pinned to WebKit 2251. Playwright >=1.62 sends an
      # unsupported PushAPIEnabled setting before a page can be created.
      # Keep this OS/browser covered with its compatible driver pairing.
      - name: Use the compatible macOS 14 WebKit driver
        if: matrix.os == 'macos-14' && matrix.browser == 'webkit'
        run: npm install --no-save --package-lock=false @playwright/test@1.60.0 playwright@1.60.0
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:gui -- --project=${{ matrix.browser }}
        env:
          DEBUG: pw:browser
          NODE_OPTIONS: --require ./scripts/browser-process-diagnostics.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            apps/batchalign/batchalign-gui/test-results/
            apps/batchalign/batchalign-gui/playwright-report/
          retention-days: 7
