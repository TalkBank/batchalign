name: publish · pypi (batchalign)

# Multi-platform wheel matrix + trusted-publisher upload to PyPI from
# TalkBank/batchalign. PyPI must trust this repository, this workflow filename,
# and the `pypi` environment exactly.
#
# Each matrix cell runs on a native runner for its target, so every wheel
# is a host build (no cross-compile). The wheel is `cp310-abi3-<plat>`,
# meaning a single artifact per platform installs on any CPython >= 3.10.
#
# Per-cell flow:
#   setup-bazel → `bazel run //python/batchalign:wheel` → upload artifact.
#
# `bazel run //python/batchalign:wheel` is one target end-to-end:
# the genrule produces the wheel + tag in bazel-bin, the sh_binary
# copies it under the tagged name into python/target/wheels/. CI does
# not script the copy.
#
# Everything else (uv, maturin, rust, clang) is pulled hermetically by
# Bazel from MODULE.bazel / multitool.lock.json / pyproject.toml's
# [tool.batchalign.pinned_tools]. We do not pre-install rust/uv/etc on
# the runner; the hermeticity guard inside the sh_binary asserts pins.
#
# Linux portability is enforced by the wheel builder's Zig-backed
# manylinux_2_28 target rather than inferred from the hosted runner's glibc.
#
# Dry-run: leave `publish` unchecked → builds for every supported platform
# and uploads as workflow artifacts only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Wheel version (must match python/pyproject.toml [project].version)"
        required: true
        type: string
      platform:
        description: "Platform to build (select one to recover a failed artifact)"
        type: choice
        default: all
        options: [all, macos-arm64, macos-x86_64, linux-x86_64, linux-aarch64, windows-x86_64]
      publish:
        description: "Upload to PyPI? (false → artifact only)"
        type: boolean
        default: false

concurrency:
  group: publish-pypi-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert pyproject.toml version matches input tag
        run: |
          pyver=$(awk -F'"' '/^version *= *"/ {print $2; exit}' python/pyproject.toml)
          if [[ "$pyver" != "${{ inputs.tag }}" ]]; then
            echo "::error::pyproject.toml version ($pyver) does not match input tag (${{ inputs.tag }})"
            echo "  fix: bump python/pyproject.toml [project].version before re-dispatching"
            exit 1
          fi


      - name: Select wheel platforms
        id: platforms
        env:
          PLATFORM: ${{ inputs.platform }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python - <<'PYTHON'
          import json, os
          platforms = [
              {"runner": "macos-15", "platform": "macos-arm64"},
              {"runner": "macos-15-intel", "platform": "macos-x86_64"},
              {"runner": "ubuntu-latest", "platform": "linux-x86_64"},
              {"runner": "ubuntu-24.04-arm", "platform": "linux-aarch64"},
              {"runner": "windows-latest", "platform": "windows-x86_64"},
          ]
          selected = os.environ["PLATFORM"] or "all"
          if selected != "all":
              if os.environ["PUBLISH"] == "true":
                  raise SystemExit("Single-platform recovery is artifact-only; publish a complete release separately")
              platforms = [p for p in platforms if p["platform"] == selected]
          if not platforms:
              raise SystemExit("Unknown wheel platform")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("matrix=" + json.dumps({"include": platforms}), file=output)
          PYTHON

  build:
    needs: [verify-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-version.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Allow bounded retries for dependency downloads
        shell: bash
        run: |
          cat >> .bazelrc.user <<'EOF'
          common --http_connector_attempts=12
          common --http_connector_retry_max_timeout=30s
          EOF

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: publish-pypi-${{ matrix.platform }}
          repository-cache: true
          cache-version: 2-${{ matrix.platform }}

      - name: Enable long git paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1

      - name: Build wheel for ${{ matrix.platform }}
        shell: bash
        env:
          BAZELISK_SKIP_WRAPPER: true
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ runner.os == 'Windows' && 'true' || 'false' }}
        run: bazel run -c opt //python/batchalign:wheel

      - name: Verify wheel contents
        shell: bash
        run: python bazel/python/verify_wheel.py python/target/wheels/batchalign-*.whl

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify clean AVQI installation and processing
        shell: bash
        run: python bazel/python/smoke_avqi_wheel.py python/target/wheels/batchalign-*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: batchalign-wheel-${{ matrix.platform }}
          path: python/target/wheels/*.whl
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/project/batchalign/
    permissions:
      # Required for the trusted-publisher OIDC flow. Configure PyPI with
      # owner `TalkBank`, repository `batchalign`, workflow
      # `publish-pypi.yml`, and environment `pypi`.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: batchalign-wheel-*
          path: dist/
          merge-multiple: true
      - name: List artifacts to upload
        run: ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # idempotent re-runs at the same version
