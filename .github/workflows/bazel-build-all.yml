name: bazel · build-all (nightly)

# Revalidate 0.10.9 after the 2026-11-09 release-download failures.
# Slow, exhaustive build across every Bazel target. Runs on a cron
# rather than on every push so PR latency stays sane. Also runnable
# on-demand via workflow_dispatch.

on:
  # Validate changes to this exhaustive workflow without waiting for the cron.
  push:
    branches: [main]
    paths: ['.github/workflows/bazel-build-all.yml']
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch: {}

env:
  BAZELISK_SKIP_WRAPPER: true

jobs:
  build-all:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Allow bounded retries for dependency downloads
        run: |
          # Match desktop CI's backoff for intermittent release-server 504s.
          cat >> .bazelrc.user <<'EOF'
          common --http_connector_attempts=12
          common --http_connector_retry_max_timeout=30s
          EOF
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-version: 2-${{ runner.os }}-${{ runner.arch }}
      - uses: astral-sh/setup-uv@v3
      - name: bazel build //...
        run: bazel build --config=ci //...
      - name: bazel test //...
        run: bazel test --config=ci //...
