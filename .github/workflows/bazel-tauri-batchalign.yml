name: bazel · tauri-batchalign

# Per-platform bundle for the Batchalign desktop GUI
# (apps/batchalign/batchalign-gui).
#
# Each matrix runner:
#   1. Sets up Bazel + Rust + Node.
#   2. Builds the sidecar daemon (//python/batchalign:sidecar).
#   3. Installs platform-specific Tauri prerequisites.
#   4. Runs `bazel run //apps/batchalign/batchalign-gui/src-tauri:bundle`,
#      which shells to `cargo tauri build`. The sidecar is staged with
#      the target-triple suffix by bazel/batchalign-tauri/bundle.sh
#      before Tauri's bundler runs, so each artifact ships its native
#      daemon binary.
#   5. Uploads the resulting .app/.dmg/.msi/.AppImage as a workflow
#      artifact.
#
# Bundles are unsigned. Code-signing / notarization is a follow-up; the
# secrets named below are placeholders for when that lands.

on:
  push:
    branches: [main]
    paths:
      - "apps/batchalign/batchalign-gui/**"
      - "bazel/batchalign-tauri/**"
      - "python/batchalign/**"
      - "crates/batchalign/**"
      - "scripts/gen_openapi.py"
      - ".github/workflows/bazel-tauri-batchalign.yml"
  pull_request:
    paths:
      - "apps/batchalign/batchalign-gui/**"
      - "bazel/batchalign-tauri/**"
      - "python/batchalign/**"
      - "crates/batchalign/**"
      - "scripts/gen_openapi.py"
      - ".github/workflows/bazel-tauri-batchalign.yml"
  workflow_dispatch:

concurrency:
  group: bazel-tauri-batchalign-${{ github.ref }}
  cancel-in-progress: true

env:
  BAZELISK_SKIP_WRAPPER: true

jobs:
  # Cheap host-platform smoke that runs on every PR. The full matrix
  # (next job) only triggers on `main` / dispatch so PR CI stays fast.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-smoke
          repository-cache: true
          cache-version: 2-${{ runner.os }}-${{ runner.arch }}

      - name: bazel build frontend filegroup
        run: bazel build --config=ci //apps/batchalign/batchalign-gui:frontend_sources

      # Protocol metadata is generated by Bazel from the live Python API
      # surface. It is not checked into the source tree, so this catches
      # generator/import breakage without creating snapshot drift.
      - name: build generated protocol artifacts
        run: bazel build --config=ci //apps/batchalign/batchalign-gui:protocol_artifacts

  bundle:
    if: github.event_name != 'pull_request'
    name: bundle (${{ matrix.runner.target }})
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        runner:
          - { os: macos-14,       target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.runner.target }}
          repository-cache: true
          cache-version: 2-${{ matrix.runner.target }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: extractions/setup-just@v2

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1

      # Tauri v2 frontend deps (Linux only — macOS/Windows ship them).
      - name: install linux tauri prereqs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      # cargo-tauri comes from //bazel/tauri:cargo_tauri (Bazel-built
      # from a SHA-pinned crates.io tarball, PATH-injected by the
      # bundle wrapper). No host install required.

      - name: npm ci (frontend)
        working-directory: apps/batchalign/batchalign-gui
        run: npm ci

      # Pre-build the sidecar daemon binary. The genrule at
      # //python/batchalign:sidecar produces a Bazel-tracked output that
      # bundle.sh resolves via rlocation + stages under
      # src-tauri/binaries/sidecar-<triple> before invoking cargo tauri
      # build.
      - name: build sidecar
        run: just batchalign sidecar

      - name: bundle Batchalign desktop
        id: desktop_bundle
        env:
          TAURI_PROFILE: release
        run: just batchalign gui build release --target ${{ matrix.runner.target }}

      - name: Cold and warm bootstrap from packaged sidecar, with native output checks
        timeout-minutes: 45
        env:
          BATCHALIGN_SMOKE_REPORT: ${{ github.workspace }}/packaged-sidecar-report.json
        run: |
          set -euo pipefail
          bundle_root="target/${{ matrix.runner.target }}/release/bundle"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sidecar=$(find "$bundle_root" -path '*/Batchalign.app/Contents/MacOS/sidecar' -type f -print -quit)
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            package=$(find "$bundle_root" -name '*.deb' -type f -print -quit)
            unpacked=$(mktemp -d)
            dpkg-deb -x "$package" "$unpacked"
            sidecar=$(find "$unpacked" -name sidecar -type f -print -quit)
          else
            package=$(find "$bundle_root" -name '*.msi' -type f -print -quit)
            unpacked=$(mktemp -d)
            MSYS_NO_PATHCONV=1 msiexec.exe /a "$(cygpath -w "$package")" /qn "TARGETDIR=$(cygpath -w "$unpacked")"
            sidecar=$(find "$unpacked" -name sidecar.exe -type f -print -quit)
          fi
          test -n "$sidecar"
          node apps/batchalign/batchalign-gui/scripts/packaged-sidecar-smoke.mjs "$sidecar"

      - name: Upload packaged runtime report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-runtime-${{ matrix.runner.target }}
          path: packaged-sidecar-report.json
          retention-days: 7

      - name: upload bundle artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.desktop_bundle.outcome == 'success'
        with:
          name: batchalign-${{ matrix.runner.target }}
          # cargo-tauri honors the workspace's root `Cargo.toml`
          # target dir, which is `target/` at the workspace root, NOT
          # `apps/batchalign/batchalign-gui/src-tauri/target/`. Glob
          # both so we tolerate either layout (host build vs CI).
          path: |
            target/${{ matrix.runner.target }}/release/bundle/**/*
            apps/batchalign/batchalign-gui/src-tauri/target/${{ matrix.runner.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  # TODO: signing / notarization
  # When org-level Apple Developer + Windows EV certs are in place, add
  # APPLE_CERTIFICATE / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID secrets
  # and wire `tauri-action`'s signing inputs into the matrix above. The
  # current artifacts are unsigned — fine for internal QA, not for
  # external release distribution.
