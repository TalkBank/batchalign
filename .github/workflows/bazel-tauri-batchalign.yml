name: bazel · tauri-batchalign

# Per-platform bundle for the Batchalign desktop GUI
# (apps/batchalign/batchalign-gui).
#
# Each matrix runner:
#   1. Sets up Bazel + Rust + Node.
#   2. Builds the sidecar daemon (//python/batchalign:sidecar).
#   3. Installs platform-specific Tauri prerequisites.
#   4. Runs `bazel run //apps/batchalign/batchalign-gui/src-tauri:bundle`,
#      which shells to `cargo tauri build`. The sidecar is staged with
#      the target-triple suffix by bazel/batchalign-tauri/bundle.sh
#      before Tauri's bundler runs, so each artifact ships its native
#      daemon binary.
#   5. Uploads the resulting .app/.dmg/.msi/.AppImage as a workflow
#      artifact.
#
# Bundles are unsigned. Code-signing / notarization is a follow-up; the
# secrets named below are placeholders for when that lands.

on:
  push:
    branches: [main]
    paths:
      - "apps/batchalign/batchalign-gui/**"
      - "bazel/batchalign-tauri/**"
      - "python/**"
      - "bazel/python/**"
      - "crates/batchalign/**"
      - "scripts/gen_openapi.py"
      - ".github/workflows/bazel-tauri-batchalign.yml"
  pull_request:
    paths:
      - "apps/batchalign/batchalign-gui/**"
      - "bazel/batchalign-tauri/**"
      - "python/**"
      - "bazel/python/**"
      - "crates/batchalign/**"
      - "scripts/gen_openapi.py"
      - ".github/workflows/bazel-tauri-batchalign.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Platform to validate (pushes always test all platforms)"
        type: choice
        default: all
        options:
          - all
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-msvc

env:
  BAZELISK_SKIP_WRAPPER: true

jobs:
  matrix:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.select.outputs.runners }}
    steps:
      - id: select
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
        run: |
          node <<'JS'
          const runners = [
            { os: 'macos-14', target: 'aarch64-apple-darwin' },
            { os: 'macos-15-intel', target: 'x86_64-apple-darwin' },
            { os: 'ubuntu-latest', target: 'x86_64-unknown-linux-gnu' },
            { os: 'ubuntu-24.04-arm', target: 'aarch64-unknown-linux-gnu' },
            { os: 'windows-2022', target: 'x86_64-pc-windows-msvc' },
          ];
          const selected = runners.filter(runner =>
            process.env.REQUESTED_TARGET === 'all' || runner.target === process.env.REQUESTED_TARGET);
          if (!selected.length) throw new Error('Unknown platform selection');
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `runners=${JSON.stringify(selected)}\n`);
          JS

  # Cheap host-platform smoke that runs on every PR. The full matrix
  # (next job) only triggers on `main` / dispatch so PR CI stays fast.
  smoke:
    runs-on: ubuntu-latest
    concurrency:
      group: bazel-tauri-batchalign-smoke-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-smoke
          repository-cache: true
          cache-version: 2-${{ runner.os }}-${{ runner.arch }}

      - name: bazel build frontend filegroup
        run: bazel build --config=ci //apps/batchalign/batchalign-gui:frontend_sources

      # Protocol metadata is generated by Bazel from the live Python API
      # surface. It is not checked into the source tree, so this catches
      # generator/import breakage without creating snapshot drift.
      - name: build generated protocol artifacts
        run: bazel build --config=ci //apps/batchalign/batchalign-gui:protocol_artifacts

  bundle:
    if: github.event_name != 'pull_request'
    needs: matrix
    name: bundle (${{ matrix.runner.target }})
    runs-on: ${{ matrix.runner.os }}
    concurrency:
      # Preserve an active platform's costly cleanroom evidence, while
      # letting completed platforms advance without waiting for the slowest.
      group: bazel-tauri-batchalign-${{ github.ref }}-${{ matrix.runner.target }}
      cancel-in-progress: false
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.matrix.outputs.runners) }}
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.runner.target }}
          repository-cache: true
          cache-version: 2-${{ matrix.runner.target }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner.target }}

      # Tauri's Cargo build escapes the Bazel action cache. Retain dependency
      # compilation even when a later installer or runtime assertion fails.
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.runner.target }}
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: extractions/setup-just@v2

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1

      # Tauri v2 frontend deps (Linux only — macOS/Windows ship them).
      - name: install linux tauri prereqs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            xdg-utils \
            patchelf

      # cargo-tauri comes from //bazel/tauri:cargo_tauri (Bazel-built
      # from a SHA-pinned crates.io tarball, PATH-injected by the
      # bundle wrapper). No host install required.

      - name: npm ci (frontend)
        working-directory: apps/batchalign/batchalign-gui
        run: npm ci

      # Pre-build the sidecar daemon binary. The genrule at
      # //python/batchalign:sidecar produces a Bazel-tracked output that
      # bundle.sh resolves via rlocation + stages under
      # src-tauri/binaries/sidecar-<triple> before invoking cargo tauri
      # build.
      - name: build sidecar
        run: just batchalign sidecar

      - name: bundle Batchalign desktop
        id: desktop_bundle
        env:
          TAURI_PROFILE: release
        run: just batchalign gui build release --target ${{ matrix.runner.target }} --verbose

      - name: Native startup and process-lifetime regression tests
        run: |
          just batchalign bootstrap-progress
          just batchalign gui native-unit --target ${{ matrix.runner.target }}

      - name: Release build-server memory before model inference
        if: ${{ !cancelled() && steps.desktop_bundle.outcome == 'success' }}
        run: just batchalign shutdown

      - name: Install browser for real packaged-daemon GUI pipeline tests
        if: ${{ !cancelled() && steps.desktop_bundle.outcome == 'success' }}
        working-directory: apps/batchalign/batchalign-gui
        run: npx playwright install --with-deps chromium

      - name: Cold and warm bootstrap from packaged sidecar, with native output checks
        if: ${{ !cancelled() && steps.desktop_bundle.outcome == 'success' }}
        timeout-minutes: 90
        env:
          BATCHALIGN_SMOKE_REPORT: ${{ github.workspace }}/packaged-sidecar-report.json
          BATCHALIGN_SMOKE_GUI: "1"
          BATCHALIGN_SMOKE_MODELS: "1"
        run: |
          set -euo pipefail
          bundle_root="target/${{ matrix.runner.target }}/release/bundle"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sidecar=$(find "$bundle_root" -path '*/Batchalign.app/Contents/MacOS/sidecar' -type f -print -quit)
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            package=$(find "$bundle_root" -name '*.deb' -type f -print -quit)
            unpacked=$(mktemp -d)
            dpkg-deb -x "$package" "$unpacked"
            sidecar=$(find "$unpacked" -name sidecar -type f -print -quit)
          else
            package=$(find "$bundle_root" -name '*.msi' -type f -print -quit)
            unpacked=$(mktemp -d)
            MSYS_NO_PATHCONV=1 msiexec.exe /a "$(cygpath -w "$package")" /qn "TARGETDIR=$(cygpath -w "$unpacked")"
            sidecar=$(find "$unpacked" -name sidecar.exe -type f -print -quit)
          fi
          test -n "$sidecar"
          node apps/batchalign/batchalign-gui/scripts/packaged-sidecar-smoke.mjs "$sidecar"

      - name: Upload packaged runtime report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-runtime-${{ matrix.runner.target }}
          path: packaged-sidecar-report.json
          retention-days: 7

      - name: Install native WebKit test driver
        if: ${{ !cancelled() && steps.desktop_bundle.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb openbox wmctrl
          cargo install tauri-driver --version 2.0.6 --locked

      - name: Install package and test the real native webview
        if: ${{ !cancelled() && steps.desktop_bundle.outcome == 'success' && runner.os == 'Linux' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          package=$(find "target/${{ matrix.runner.target }}/release/bundle" -name '*.deb' -type f -print -quit)
          sudo apt-get install -y "$PWD/$package"
          # Tauri's tar member paths can omit './'. Query the installed
          # package for canonical absolute paths and exclude its sidecar.
          executable=$(dpkg-query -L batchalign | awk '$0 ~ /^\/usr\/bin\/[^/]+$/ && $0 !~ /\/sidecar$/ { print }')
          test -x "$executable"
          xvfb-run -a node apps/batchalign/batchalign-gui/scripts/native-webview-smoke.mjs "$executable" packaged-sidecar-report.json

      - name: Install matching Windows native webview drivers
        if: ${{ !cancelled() && steps.desktop_bundle.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          cargo install tauri-driver --version 2.0.6 --locked
          if ($LASTEXITCODE -ne 0) { throw "tauri-driver installation failed" }
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          if ($LASTEXITCODE -ne 0) { throw "Edge driver helper installation failed" }
          msedgedriver-tool.exe
          if ($LASTEXITCODE -ne 0) { throw "matching Edge driver download failed" }
          "$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install MSI and test the real Windows webview
        if: ${{ !cancelled() && steps.desktop_bundle.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        timeout-minutes: 30
        run: |
          $package = Get-ChildItem "target/${{ matrix.runner.target }}/release/bundle" -Recurse -Filter *.msi | Select-Object -First 1
          if (!$package) { throw "MSI artifact missing" }
          $installDir = Join-Path $env:RUNNER_TEMP 'Batchalign Installed'
          $log = Join-Path $env:GITHUB_WORKSPACE 'native-msi-install.log'
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$($package.FullName)`"", '/qn', '/norestart', "INSTALLDIR=`"$installDir`"", '/l*v', "`"$log`"")
          if ($install.ExitCode -notin @(0, 3010)) { throw "MSI installation failed: $($install.ExitCode)" }
          $application = Join-Path $installDir 'Batchalign.exe'
          if (!(Test-Path $application)) { throw "installed application missing: $application" }
          node apps/batchalign/batchalign-gui/scripts/native-webview-smoke.mjs $application packaged-sidecar-report.json
          if ($LASTEXITCODE -ne 0) { throw "Windows native webview tests failed" }

      - name: Build macOS native-webview test instrumentation
        if: ${{ !cancelled() && steps.desktop_bundle.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          just batchalign gui build release --target ${{ matrix.runner.target }} --features webdriver --no-bundle --config src-tauri/tauri.webdriver.conf.json
          just batchalign shutdown

      - name: Install macOS QA app and test its native WKWebView
        if: ${{ !cancelled() && steps.desktop_bundle.outcome == 'success' && runner.os == 'macOS' }}
        timeout-minutes: 30
        run: |
          set -euo pipefail
          original="target/${{ matrix.runner.target }}/release/bundle/macos/Batchalign.app"
          installed="$RUNNER_TEMP/Batchalign QA.app"
          ditto "$original" "$installed"
          cp "target/${{ matrix.runner.target }}/release/Batchalign" "$installed/Contents/MacOS/Batchalign"
          xattr -cr "$installed"
          codesign --force --deep --sign - "$installed"
          node apps/batchalign/batchalign-gui/scripts/native-webview-smoke.mjs "$installed/Contents/MacOS/Batchalign" packaged-sidecar-report.json --embedded

      - name: Record Windows runtime failure diagnostics
        if: ${{ !cancelled() && steps.desktop_bundle.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE 'windows-runtime-diagnostics.txt'
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory, TotalVirtualMemorySize, FreeVirtualMemory | Format-List | Out-File $report
          Get-Process python*, sidecar*, java* -ErrorAction SilentlyContinue | Select-Object Name, Id, WorkingSet64, PrivateMemorySize64, VirtualMemorySize64 | Format-Table | Out-File $report -Append
          foreach ($log in @('Application', 'System')) {
            Get-WinEvent -FilterHashtable @{LogName=$log; StartTime=(Get-Date).AddHours(-3); Id=1000,1001,2004} -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'python|sidecar|Batchalign|virtual memory' } | Select-Object TimeCreated, Id, Message | Format-List | Out-File $report -Append
          }
          Get-Content $report

      - name: Upload installed native-webview evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-webview-${{ matrix.runner.target }}
          path: |
            native-webview-evidence/
            native-msi-install.log
            windows-runtime-diagnostics.txt
          retention-days: 7

      - name: Upload real-daemon GUI evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-daemon-gui-${{ matrix.runner.target }}
          path: apps/batchalign/batchalign-gui/test-results/
          retention-days: 7

      - name: upload bundle artifact
        uses: actions/upload-artifact@v4
        # Preserve a built .app and bundler scripts even if installer creation fails.
        if: always()
        with:
          name: batchalign-${{ matrix.runner.target }}
          # cargo-tauri honors the workspace's root `Cargo.toml`
          # target dir, which is `target/` at the workspace root, NOT
          # `apps/batchalign/batchalign-gui/src-tauri/target/`. Glob
          # both so we tolerate either layout (host build vs CI).
          path: |
            target/${{ matrix.runner.target }}/release/bundle/**/*
            apps/batchalign/batchalign-gui/src-tauri/target/${{ matrix.runner.target }}/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  # TODO: signing / notarization
  # When org-level Apple Developer + Windows EV certs are in place, add
  # APPLE_CERTIFICATE / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID secrets
  # and wire `tauri-action`'s signing inputs into the matrix above. The
  # current artifacts are unsigned — fine for internal QA, not for
  # external release distribution.
