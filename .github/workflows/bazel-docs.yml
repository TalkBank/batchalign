name: bazel · docs

# Build the mdBook website, then publish to GitHub Pages.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "book/**"
      - "bazel/book/**"
      - "just/docs.just"
      - ".github/workflows/bazel-docs.yml"
  pull_request:
    paths:
      - "book/**"
      - "bazel/book/**"
      - "just/docs.just"
      - ".github/workflows/bazel-docs.yml"

concurrency:
  group: bazel-docs-${{ github.ref }}
  cancel-in-progress: true

env:
  BAZELISK_SKIP_WRAPPER: true

permissions:
  contents: read

jobs:
  build-and-linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          cache-version: 2-${{ runner.os }}-${{ runner.arch }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - name: Install mdbook + mdbook-mermaid + mdbook-linkcheck2
        run: just docs setup
      - name: Build mdBook website
        run: just docs build
      - name: Check download script syntax
        run: node --check book/src/downloads.js
      - uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: book/build/html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: book/build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-linkcheck
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
